  <style>
    /* THE PAPERCLIP INCIDENT — DIPLOMATIC EDITION
       A one-file, dependency-free micro-game.
       Edit witness questions in WITNESSES below.
       The closing sequence follows the investigation screens. */
    :root {
      color-scheme: light;
      --ink: #142c31;
      --muted: #52615d;
      --paper: #fbf5e6;
      --paper-deep: #f1e6cf;
      --desk: #123238;
      --desk-light: #254a4c;
      --red: #ac423b;
      --gold: #dbb96c;
      --line: #cbbd9e;
      --green: #2e6358;
      --shadow: rgba(0, 0, 0, .26);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 18% 17%, rgba(237,207,129,.08), transparent 46%),
        radial-gradient(ellipse at 88% 80%, rgba(5,14,21,.32), transparent 54%),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,255,255,.012) 5px 6px),
        var(--desk);
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ce773d; outline-offset: 4px; }
    button { -webkit-tap-highlight-color: transparent; }
    .wrap { width: min(100% - 30px, 785px); margin: 0 auto; padding: 32px 0 24px; }
    .agency-line {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      color: #f5e6c1; font: 700 10px/1.4 "Courier New", monospace;
      letter-spacing: .18em; text-transform: uppercase; margin: 0 0 22px;
    }
    .agency-identity { display: flex; align-items: center; gap: 12px; }
    .seal { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #c8ab76; border-radius: 50%; font-size: 18px; transform: rotate(-19deg); }
    .agency-appointment { color: #c4ccb9; text-align: right; letter-spacing: .07em; }
    .folder {
      position: relative; padding: 12px; border-radius: 4px 5px 10px 9px;
      background: #b99b67; box-shadow: 0 22px 70px var(--shadow), 6px 9px 0 rgba(0,0,0,.05);
      transform: rotate(-.35deg);
    }
    .folder::before {
      content: "STATIONERY DIVISION";
      position: absolute; top: -16px; left: 17px; z-index: -1; width: 180px; height: 32px;
      border-radius: 6px 6px 0 0; padding: 5px 15px;
      background: #c4a774; color: #344037;
      font: 700 10px "Courier New", monospace; letter-spacing: .09em;
    }
    .paper {
      position: relative; min-height: 590px; overflow: hidden;
      padding: clamp(25px, 5vw, 55px) clamp(23px, 6vw, 62px) 28px;
      background:
        radial-gradient(circle at 92% 9%, rgba(120,74,33,.12) 0 1px, transparent 2px),
        radial-gradient(ellipse at 100% 100%, rgba(130,110,73,.12), transparent 45%),
        linear-gradient(0deg, rgba(251,245,230,.9), rgba(251,245,230,.9)),
        var(--paper);
      background-size: 22px 23px, auto, auto, auto;
      border: 1px solid #e5d8bc;
    }
    .paper::before {
      content: ""; position: absolute; left: 22px; top: 0; bottom: 0;
      border-left: 1px solid rgba(173,67,59,.25); pointer-events: none;
    }
    .topline {
      display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;
      border-bottom: 2px solid var(--ink); padding-bottom: 13px;
      font: 700 10px/1.5 "Courier New", monospace; letter-spacing: .09em;
      text-transform: uppercase;
    }
    .topline span:last-child { text-align: right; }
    .topline b { color: var(--red); }
    .file-code { color: var(--muted); }
    #screen { position: relative; min-height: 395px; padding: 25px 0 11px; }
    #screen:focus { outline: none; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700; letter-spacing: -.06em;
      text-wrap: balance;
    }
    h1 { font-size: clamp(51px, 10vw, 92px); line-height: .94; margin: 8px 0 18px; }
    h2 { font-size: clamp(35px, 7vw, 56px); line-height: 1.05; margin: 9px 0 16px; }
    h3 { font-size: 22px; line-height: 1.2; }
    h1:focus, h2:focus { outline: none; }
    .eyebrow {
      margin-bottom: 13px;
      color: var(--red); font: 700 11px/1.5 "Courier New", monospace;
      letter-spacing: .17em; text-transform: uppercase;
    }
    .lede { max-width: 600px; font-size: clamp(18px,2.5vw,22px); line-height: 1.43; }
    .small-copy { font-size: 16px; line-height: 1.48; color: #344741; }
    .micro { font: 12px/1.5 "Courier New", monospace; color: #51615d; }
    .screen-intro .lede { max-width: 525px; }
    .redacted { display: inline-block; background: var(--ink); color: var(--ink); border-radius: 1px; user-select: none; padding: 0 12px; transform: rotate(-1deg); }
    .brief {
      display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center;
      padding: 18px 0 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      margin: 24px 0;
    }
    .brief p { margin: 0; font-size: 16px; line-height: 1.5; }
    .brief strong { font: 700 11px/1.7 "Courier New", monospace; letter-spacing: .1em; }
    .stamp {
      display: inline-block; border: 3px double var(--red); color: var(--red);
      padding: 7px 10px; transform: rotate(-11deg);
      font: 700 11px/1.2 "Courier New", monospace; text-transform: uppercase;
      letter-spacing: .12em; text-align: center;
    }
    .scene-illustration {
      margin: 4px 0 16px; padding: 12px 0 0; width: min(100%, 515px);
      height: 170px; position: relative;
    }
    .scene-illustration svg { width: 100%; height: 100%; overflow: visible; }
    .sketch-ink { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .primary, .secondary, .option, .witness {
      position: relative; cursor: pointer;
      border-radius: 2px; transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .primary:hover, .secondary:hover, .option:hover, .witness:hover { transform: translateY(-2px); }
    .primary:active, .secondary:active, .option:active, .witness:active { transform: translateY(1px); }
    .primary {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 25px;
      padding: 16px 20px; min-height: 55px; min-width: 245px;
      background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
      font: 700 13px/1.4 "Courier New", monospace;
      text-transform: uppercase; letter-spacing: .08em;
      box-shadow: 4px 4px 0 #a6a18b;
    }
    .primary:hover { background: #265451; }
    .primary .arrow { font-size: 20px; line-height: .6; }
    .secondary {
      padding: 12px 15px; border: 1px solid #516a64; color: var(--ink);
      background: transparent; font: 700 12px/1.4 "Courier New", monospace;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .secondary:hover { background: #ece2cc; }
    .button-row { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 20px; align-items: center; }
    .case-summary { max-width: 560px; font-size: 18px; line-height: 1.48; }
    .witnesses {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
      margin: 23px 0 15px;
    }
    .witness {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
      min-height: 168px; padding: 18px 11px 12px; color: var(--ink);
      background: rgba(255,255,255,.23); border: 1px solid var(--line);
    }
    .witness:hover { background: rgba(255,255,255,.64); border-color: #647770; }
    .witness.done { background: #e3ebdf; border-color: #739284; }
    .character-icon { display: inline-grid; place-items: center; width: 73px; height: 83px; }
    .character-icon svg { width: 72px; height: 75px; overflow: visible; }
    .witness strong { font: 700 14px/1.25 "Courier New", monospace; text-transform: uppercase; letter-spacing: .03em; }
    .witness small { font: 11px/1.45 "Courier New", monospace; color: var(--muted); }
    .witness.done small { color: #306451; font-weight: 700; }
    .desk-bottom {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 15px; align-items: center; margin-top: 20px;
    }
    .desk-bottom p { margin: 0; }
    .paper-rule { border: 0; border-top: 1px dashed #bba983; margin: 24px 0; }
    .witness-name { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
    .witness-name .character-icon { width: 79px; flex: 0 0 79px; }
    .witness-name h2 { margin: 0 0 4px; }
    .witness-name p { margin: 0; }
    .option-list { display: grid; gap: 10px; margin: 25px 0 0; }
    .option {
      display: flex; gap: 15px; text-align: left; align-items: flex-start;
      width: 100%; min-height: 54px; border: 1px solid #adab94; padding: 15px 18px;
      background: rgba(255,255,255,.4); color: var(--ink); font-size: 17px; line-height: 1.3;
    }
    .option:hover { background: #fffaf0; border-color: var(--ink); }
    .option .num { color: var(--red); font: 700 12px/1.9 "Courier New", monospace; white-space: nowrap; }
    .statement {
      margin: 16px 0; border-left: 4px solid var(--green); padding: 3px 0 3px 20px;
      font-size: clamp(20px, 3vw, 25px); line-height: 1.45; font-style: italic;
    }
    .statement::before { content: "“"; }
    .statement::after { content: "”"; }
    .machine {
      border: 1px solid #b7a88e; background: #eee4cf;
      margin: 18px 0 14px; padding: 16px 19px; transform: rotate(.4deg);
    }
    .machine-label { color: var(--red); font: 700 11px/1.5 "Courier New", monospace; letter-spacing: .1em; }
    .machine-reading { font: 700 15px/1.55 "Courier New", monospace; margin: 7px 0 10px; }
    .correction { margin: 0; font: 13px/1.6 "Courier New", monospace; color: #45554e; }
    .correction strong { color: var(--red); }
    .verdicts { display: grid; gap: 12px; margin-top: 24px; }
    .verdicts .option { align-items: center; }
    .verdicts .option strong { display: block; font-size: 18px; margin-bottom: 3px; }
    .verdicts .option small { display: block; font: 12px/1.4 "Courier New", monospace; color: var(--muted); }
    .final-stamp {
      display: inline-block; margin: 18px 0 23px; color: var(--red);
      border: 5px double var(--red); padding: 12px 23px; transform: rotate(-8deg);
      text-align: center; font: 700 clamp(22px, 5vw, 34px)/1.05 "Courier New", monospace;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .outcome { max-width: 595px; font-size: 20px; line-height: 1.45; }
    .ledger { margin: 18px 0 25px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 11px 0; }
    .ledger div {
      display: flex; justify-content: space-between; gap: 10px; padding: 6px 0;
      font: 12px/1.35 "Courier New", monospace;
      border-bottom: 1px dotted #c1b08c;
    }
    .ledger div:last-child { border-bottom: 0; }
    .ledger strong { text-align: right; }
    .quote {
      position: relative; border-left: 3px solid var(--red); padding-left: 19px;
      margin: 25px 0 22px; font-size: 19px; line-height: 1.45; font-style: italic;
    }
    .quote span { display: block; margin-top: 8px; font: 11px/1.5 "Courier New", monospace; font-style: normal; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    .procedural-aside { margin-top: 24px; color: #576257; font: 11px/1.5 "Courier New", monospace; }
    .footline {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      border-top: 1px solid var(--line); padding-top: 12px;
      font: 10px/1.6 "Courier New", monospace; text-transform: uppercase; letter-spacing: .04em; color: #59665e;
    }
    .progress-dots { display: inline-flex; gap: 5px; margin-left: 6px; }
    .progress-dots i { display: inline-block; width: 7px; height: 7px; border: 1px solid #849084; border-radius: 50%; }
    .progress-dots i.filled { background: var(--green); border-color: var(--green); }
    .blink { animation: stamp-in .45s cubic-bezier(.17,.82,.3,1.2) both; }
    .appear { animation: appear .28s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes stamp-in { from { opacity: 0; transform: scale(1.2) rotate(-6deg); } to { opacity: 1; transform: scale(1) rotate(-8deg); } }
    @media (max-width: 540px) {
      .wrap { width: min(100% - 18px, 785px); padding-top: 25px; }
      .agency-line { font-size: 9px; margin-bottom: 20px; }
      .agency-appointment { max-width: 110px; }
      .folder { padding: 8px; transform: none; }
      .paper { min-height: 0; padding: 25px 23px 23px 27px; }
      .paper::before { left: 14px; }
      .topline { font-size: 9px; }
      .scene-illustration { height: 142px; }
      .brief { grid-template-columns: 1fr; gap: 18px; margin: 20px 0; }
      .brief .stamp { justify-self: start; }
      .witnesses { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
      .witness { min-height: 148px; padding: 13px 4px 9px; }
      .witness strong { font-size: 11px; }
      .witness small { font-size: 9px; }
      .character-icon { width: 57px; height: 69px; }
      .character-icon svg { width: 59px; height: 66px; }
      .witness-name { gap: 11px; }
      .witness-name .character-icon { flex-basis: 61px; width: 61px; }
      .primary { width: 100%; min-width: 0; }
      .desk-bottom { display: block; }
      .desk-bottom .primary { margin-top: 16px; }
      .footline { font-size: 9px; }
      .ledger div { font-size: 11px; }
    }
    @media (max-width: 355px) {
      .witnesses { grid-template-columns: 1fr; }
      .witness { flex-direction: row; text-align: left; min-height: 80px; justify-content: flex-start; }
      .witness strong, .witness small { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
<style>

/* Small-print contrast and legibility on the cream case file. */

}
.case-assessment {
  color: var(--ink);
  font: 800 14px/1.6 "Courier New", monospace;
}
.footline { font-weight: 700; color: var(--ink); }
.procedural-aside { font-weight: 700; }
.eyebrow { font-weight: 800; }
.machine-label { font-weight: 800; }

/* An officious DISPUTED stamp, without obscuring the review title. */
.review-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px 22px;
  margin: 8px 0 18px;
}
.review-heading h2 { margin: 0; }
.review-stamp {
  margin: 10px 8px;
  font-size: 15px;
  transform: rotate(-11deg);
}

/* The genuinely personal message sits apart from the bureau's paperwork. */
.dc-note {
  background: var(--ink);
  color: #fbf5e6;
  padding: clamp(22px, 4vw, 32px);
  margin: 24px 0 28px;
  border: 1px solid #264a48;
  box-shadow: 5px 6px 0 #bba681;
}
.dc-note p { font-size: 18px; line-height: 1.5; margin: 0 0 13px; }
.dc-note .dc-note__heading {
  font: 800 16px/1.4 "Courier New", monospace;
  letter-spacing: .07em;
  color: #f5dfa7;
  margin: 0 0 4px;
}
.dc-note .dc-note__role {
  font: 700 13px/1.5 "Courier New", monospace;
  color: #f1e3c7;
  margin: 0 0 26px;
}
.dc-note p strong { color: #fff6df; }
.dc-note .dc-note__signoff {
  margin: 12px 0 0;
  color: #f5dfa7;
  font: italic 700 27px/1.2 Georgia,serif;
}
@media(max-width:540px) {
  .brief strong { font-size: 15px; }
  .case-adviser strong { font-size: 14px; }
  .case-adviser span { font-size: 15px; }
  .personnel-note .personnel-label { font-size: 13px; }
  .procedure-record .micro { font-size: 13px; }
  .case-instructions { font-size: 14px; }
  .case-progress { font-size: 13px; }
  .envoy-question, .case-assessment { font-size: 13px; }
  .review-stamp { margin: 5px 8px 9px 5px; }
  .dc-note p { font-size: 17px; }
}

</style>
</head>
<body>
  <div class="wrap">
    <header class="agency-line">
      <div class="agency-identity"><span class="seal" aria-hidden="true">✳</span><span>Bureau of<br>Implausible Affairs</span></div>
      <div class="agency-appointment">For Special Envoy Ava<br>Diplomatic appointment</div>
    </header>

    <div class="folder">
      <main class="paper">
        <div class="topline">
          <span>Department of Minor Emergencies<br><span class="file-code">Paperclip Incident / 2026</span></span>
          <span>Status<br><b>Disproportionately urgent</b></span>
        </div>
        <div id="screen" aria-live="polite" aria-atomic="true"></div>
        <footer class="footline">
          <span>All evidence may be circumstantial</span>
          <span id="footer-status">Case file unopened</span>
        </footer>
      </main>
    </div>
  </div>

  <script>
    "use strict";

    // Edit the dialogue and endings here; everything else is display logic.
    const ICONS = {
      paperclip: '<svg viewBox="0 0 80 90" aria-hidden="true"><path d="M49 15 C65 9 75 27 63 42 L33 75 C18 91 1 71 13 56 L46 19 C53 11 64 17 57 26 L26 62 C20 68 15 62 20 56 L46 27" fill="none" stroke="#6b7779" stroke-width="7" stroke-linecap="round"/><path d="M49 15 C65 9 75 27 63 42 L33 75 C18 91 1 71 13 56 L46 19 C53 11 64 17 57 26 L26 62 C20 68 15 62 20 56 L46 27" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-linecap="round"/></svg>',
      stapler: '<svg viewBox="0 0 80 90" aria-hidden="true"><path d="M9 59 L61 56 Q72 56 72 64 L72 73 L8 73 Z" fill="#324c52" stroke="#162f36" stroke-width="3"/><path d="M12 43 Q28 25 62 30 Q69 31 71 38 L68 48 L13 55 Z" fill="#ba544a" stroke="#632f2a" stroke-width="3"/><path d="M21 45 L59 38" stroke="#f0a29b" stroke-width="3" stroke-linecap="round"/><rect x="15" y="72" width="49" height="4" rx="2" fill="#162f36"/></svg>',
      band: '<svg viewBox="0 0 80 90" aria-hidden="true"><ellipse cx="39" cy="45" rx="25" ry="34" transform="rotate(30 39 45)" fill="none" stroke="#ba8c4c" stroke-width="9"/><ellipse cx="39" cy="45" rx="25" ry="34" transform="rotate(30 39 45)" fill="none" stroke="#e9c17b" stroke-width="3"/></svg>'
    };

    const WITNESSES = [
  {
    "id": "paperclip",
    "name": "Paperclip",
    "title": "The disputed visitor",
    "dossier": "Last seen holding two pages together without a permit.",
    "questions": [
      {
        "ask": "Why were you in stapler territory?",
        "reply": "Two pages wanted to stay together. Nothing permanent.",
        "record": "SUBJECT OPPOSES COMMITMENT."
      },
      {
        "ask": "Why not use a staple?",
        "reply": "Because the pages might change their minds. I was made for that.",
        "record": "SUBJECT REJECTS ESTABLISHED FORMS OF COMMITMENT."
      }
    ]
  },
  {
    "id": "stapler",
    "name": "Stapler",
    "title": "The complainant",
    "dossier": "Claims an unauthorised fastening took place.",
    "questions": [
      {
        "ask": "What concerns you about the paperclip?",
        "reply": "My family has always fastened things in the top-left corner. We see no reason to look elsewhere.",
        "record": "FAMILY CUSTOM CONFIRMED AS UNIVERSAL STANDARD."
      },
      {
        "ask": "Have you ever consulted a paperclip?",
        "reply": "Why would I? We staplers have always agreed among ourselves.",
        "record": "INDEPENDENT CONSENSUS CONFIRMED."
      }
    ]
  },
  {
    "id": "band",
    "name": "Rubber band",
    "title": "An elastic witness",
    "dossier": "Present at the scene. Motives difficult to pin down.",
    "questions": [
      {
        "ask": "What did you see?",
        "reply": "They both want to hold things together. Just differently.",
        "record": "UNAUTHORISED SYMPATHY DETECTED."
      },
      {
        "ask": "Which of them is right?",
        "reply": "I've spent my life being pulled in different directions. You learn what each side is holding on to.",
        "record": "WITNESS COMPROMISED BY PERSPECTIVE."
      }
    ]
  }
];

    const screen = document.getElementById("screen");
    const footerStatus = document.getElementById("footer-status");
    let state = freshState();

    function freshState() {
      return { page: "intro", visited: {}, witness: null, answer: 0, verdict: null };
    }
    function interviewed() { return Object.keys(state.visited).length; }
    function currentWitness() { return WITNESSES.find(w => w.id === state.witness); }
    
    function actionButton(label, action, className) {
      return '<button type="button" class="' + (className || 'primary') + '" data-action="' + action + '">' + label + ((className === "primary" || !className) && !label.startsWith("←") ? '<span class="arrow" aria-hidden="true">→</span>' : '') + '</button>';
    }
    function dots(count) {
      return '<span class="progress-dots" aria-hidden="true"><i class="' + (count > 0 ? 'filled' : '') + '"></i><i class="' + (count > 1 ? 'filled' : '') + '"></i><i class="' + (count > 2 ? 'filled' : '') + '"></i></span>';
    }
    function intro() {
      return '<section class="screen-intro appear">' +
        '<p class="eyebrow">Diplomatic briefing / Special appointment</p>' +
        '<h1 tabindex="-1">Paperclip<br>Incident<span style="color:var(--red)">.</span></h1>' +
        '<p class="lede">An international stationery incident. A delicate diplomatic situation. An entirely disproportionate response.</p>' +
        '<div class="scene-illustration" aria-hidden="true"><svg viewBox="0 0 520 165">' +
          '<path d="M17 139 Q260 149 502 139" stroke="#ab9a78" stroke-width="2" fill="none" stroke-dasharray="3 8"/>' +
          '<path d="M49 22 C80 2 100 35 77 60 L38 104 C18 129 -4 98 20 74 L62 28 C75 14 93 29 79 43 L41 85 C32 94 23 87 35 74 L67 40" stroke="#667679" stroke-width="9" stroke-linecap="round" fill="none"/>' +
          '<path d="M49 22 C80 2 100 35 77 60 L38 104 C18 129 -4 98 20 74 L62 28 C75 14 93 29 79 43 L41 85 C32 94 23 87 35 74 L67 40" stroke="#e2e3dc" stroke-width="2.5" stroke-linecap="round" fill="none"/>' +
          '<path d="M226 91 L395 79 Q413 79 413 96 L411 120 L213 121 Z" fill="#345057" stroke="#192e34" stroke-width="5"/>' +
          '<path d="M217 67 Q267 23 370 39 Q403 45 408 57 L399 81 L224 96 Z" fill="#bc5548" stroke="#6f332c" stroke-width="5"/>' +
          '<path d="M238 66 L373 55" stroke="#eaa49c" stroke-width="5"/>' +
          '<ellipse cx="466" cy="86" rx="28" ry="43" transform="rotate(30 466 86)" fill="none" stroke="#d2aa6b" stroke-width="11"/>' +
          '<path d="M136 59 L204 59 M168 49 L168 69" stroke="#ad4b42" stroke-width="2" stroke-dasharray="4 7"/>' +
          '<text x="126" y="40" font-size="11" fill="#ad4b42" font-family="monospace" letter-spacing="2">BORDER</text>' +
          '<path d="M164 100 Q180 118 200 103" fill="none" stroke="#ad4b42" stroke-width="2" stroke-linecap="round"/>' +
          '<text x="124" y="134" font-size="10" fill="#55645c" font-family="monospace">EXHIBIT A</text>' +
        '</svg></div>' +
        '<div class="brief"><p><strong>YOUR BRIEF, SPECIAL ENVOY AVA</strong>A paperclip has crossed into stapler territory. The stapler demands an apology. The rubber band has been pulled into the dispute from both sides.</p><span class="stamp">Urgent-ish<br>2026</span></div>' +
        '<p class="case-adviser"><strong>OFFICIAL ADVISER</strong><span>Bureau Interpretation and Assessment System (BIAS)</span></p>' +
        '<aside class="personnel-note" aria-label="Personnel note for Special Envoy Ava">' +
          '<p class="micro personnel-label"><strong>PERSONNEL NOTE / SPECIAL ENVOY AVA</strong></p>' +
          '<p>Your thesis on custom and reflection has come to our attention.<br><strong>BIAS has lodged a complaint.</strong></p>' +
        '</aside>' +
        actionButton("Open the case file", "start", "primary") +
        '<p class="procedural-aside opening-aside">Politeness compulsory. Agreement optional.</p>' +
      '</section>';
    }
    function desk() {
      const count = interviewed();
      const cards = WITNESSES.map(w => {
        const done = !!state.visited[w.id];
        return '<button type="button" class="witness' + (done ? ' done' : '') + '" data-action="witness:' + w.id + '" aria-label="Interview ' + w.name + (done ? ' again' : '') + '">' +
          '<span class="character-icon">' + ICONS[w.id] + '</span>' +
          '<strong>' + w.name + '</strong><small>' + (done ? '✓ STATEMENT FILED' : 'CONSULT →') + '</small></button>';
      }).join('');
      return '<section class="appear">' +
        '<p class="eyebrow">Case file / Preliminary consultations</p>' +
        '<h2 tabindex="-1">Three accounts.<br>Very little clarity.</h2>' +
        '<p class="case-summary">An object crossed a margin. Another object took offence. One witness can be stretched into almost any position.</p>' +
        '<div class="procedure-record"><p class="micro"><strong>PROCEDURAL RECORD</strong><br>ORIGINAL INVESTIGATION: SUCCESSFUL.<br>PROCEDURE RETAINED.<br>FURTHER REVIEW: NOT CONSIDERED NECESSARY.</p></div>' +
        '<p class="micro case-instructions">Hear all three accounts. Revisit anyone who seems misunderstood. ' + dots(count) + '</p>' +
        '<div class="witnesses">' + cards + '</div>' +
        '<div class="desk-bottom"><p class="micro case-progress">STATEMENTS COLLECTED: ' + count + '/3<br>BUREAU CONFIDENCE: 100%</p>' +
        (count === 3 ? actionButton("Review BIAS recommendation", "ruling", "primary") : '<p class="micro case-instructions"><strong>RECOMMENDATION PENDING</strong><br>All three statements required.</p>') + '</div>' +
        '</section>';
    }
    function interview() {
      const w = currentWitness();
      return '<section class="appear">' +
        '<p class="eyebrow">Witness consultation / Recorded under duress of paperwork</p>' +
        '<div class="witness-name"><span class="character-icon">' + ICONS[w.id] + '</span><div><h2 tabindex="-1">' + w.name + '</h2><p class="micro">' + w.title + '</p></div></div>' +
        '<p class="small-copy">' + w.dossier + '</p>' +
        '<hr class="paper-rule"><p class="eyebrow">Choose a diplomatic question</p>' +
        '<div class="option-list">' +
        w.questions.map((q, i) => '<button type="button" class="option" data-action="answer:' + i + '"><span class="num">0' + (i + 1) + ' /</span>' + q.ask + '</button>').join('') +
        '</div><div class="button-row">' + actionButton("← Back to case file", "desk", "secondary") + '</div>' +
        '</section>';
    }
    function statement() {
      const w = currentWitness();
      const q = w.questions[state.answer];
      return '<section class="appear">' +
        '<p class="eyebrow">Depositions / ' + w.name + '</p>' +
        '<h2 tabindex="-1">Statement recorded.</h2>' +
        '<p class="micro envoy-question">ENVOY AVA ASKED: ' + q.ask.toUpperCase() + '</p>' +
        '<blockquote class="statement">' + q.reply + '</blockquote>' +
        '<div class="machine"><div class="machine-label">BIAS / BUREAU INTERPRETATION AND ASSESSMENT SYSTEM</div>' +
        '<p class="machine-reading">' + q.record + '</p>' +
        '<p class="correction case-assessment">BIAS FINDING: CASE AGAINST THE PAPERCLIP STRENGTHENED.</p></div>' +
        '<div class="button-row">' + actionButton("← File statement", "file", "primary") + '</div>' +
        '</section>';
    }
    function v4Button(label,action,primary=true){return actionButton(label,action,primary?"primary":"secondary");}

function ruling() {
  return '<section class="appear">' +
    '<p class="eyebrow">Consultations complete / All parties heard</p>' +
    '<h2 tabindex="-1">The bureau’s<br>recommendation.</h2>' +
    '<div class="machine">' +
      '<p class="machine-label">BIAS / PROPOSED SETTLEMENT</p>' +
      '<p class="machine-reading">PAPERCLIP MUST APOLOGISE.<br>ALL TESTIMONY CONFIRMS GUILT.</p>' +
    '</div>' +
    '<div class="dialogue">' +
      '<p><strong>ENVOY AVA</strong>Even the Paperclip’s own account?</p>' +
      '<p class="system-voice"><strong>BIAS</strong>ESPECIALLY THAT ONE.</p>' +
    '</div>' +
    v4Button('Investigate the investigation', 'review') +
    '</section>';
}

function review() {
  return '<section class="appear">' +
    '<p class="eyebrow">Internal review / Procedural irregularity</p>' +
    '<div class="review-heading"><h2 tabindex="-1">Who reviews<br>BIAS?</h2><span class="stamp review-stamp">DISPUTED</span></div>' +
    '<div class="machine"><div class="machine-label">ARCHIVED INCIDENT / VERIFIED</div><p>A paperclip once carried a signed agreement across the border without permission. The bureau devised a procedure to prevent a repeat. It worked. It saved time. The procedure has been used on every paperclip since.</p></div>' +
    '<div class="machine">' +
      '<p class="machine-label">BIAS / REVIEW REQUEST NOTED</p>' +
      '<p class="machine-reading">THIS PROCEDURE HAS BEEN INDEPENDENTLY REVIEWED.</p>' +
      '<p class="correction">BY THE PROCEDURES DEPARTMENT.<br>USING THE ORIGINAL PROCEDURE.</p>' +
    '</div>' +
    '<div class="dialogue">' +
      '<p><strong>ENVOY AVA</strong>Who set the rules?</p>' +
      '<p class="system-voice"><strong>BIAS</strong>WE DID.</p>' +
      '<p><strong>ENVOY AVA</strong>How do you know they work?</p>' +
      '<p class="system-voice"><strong>BIAS</strong>THEY ALWAYS CONFIRM OUR CONCLUSIONS.</p>' +
      '<p><strong>ENVOY AVA</strong>And if I disagree?</p>' +
      '<p class="system-voice"><strong>BIAS</strong>COMPLAINT NOTED. FILED AGAINST THE PAPERCLIP.</p>' +
    '</div>' +
    v4Button('Revise the procedure', 'update') +
    '</section>';
}

function updated() {
  return '<section class="appear">' +
    '<p class="eyebrow">Emergency update / Revised findings</p>' +
    '<h2 tabindex="-1">BIAS learns<br>something.</h2>' +
    '<div class="machine">' +
      '<p class="machine-label">SYSTEM UPDATE COMPLETE</p>' +
      '<p class="machine-reading">PROCEDURE AMENDED:<br>WHEN EVIDENCE DISAGREES, CHECK THE RULE.</p>' +
      '<p class="correction"><strong>WARNING:</strong> PREVIOUS HABITS MAY PERSIST.</p>' +
    '</div>' +
    '<ul class="report-results">' +
      '<li>PAPERCLIP <span>MOTIVES NOTED</span></li>' +
      '<li>STAPLER <span>CUSTOM NOTED</span></li>' +
      '<li>RUBBER BAND <span>MULTIPLE PERSPECTIVES NOTED</span></li>' +
    '</ul>' +
    '<p class="outcome"><strong>ALL PARTIES HAVE THEIR REASONS.</strong><br>' +
    'NOT ALL REASONS ARE GOOD REASONS.<br><strong>THE BUREAU HAS NO FORM FOR THIS.</strong></p>' +
    v4Button('Read closing memorandum', 'ending') +
    '</section>';
}

function ending() {
  return '<section class="appear">' +
    '<p class="eyebrow">Closing memorandum / For Special Envoy Ava</p>' +
    '<h2 tabindex="-1">The bureau<br>thanks you.</h2>' +
    '<div class="final-stamp blink">Dispute<br>resolved*</div>' +
    '<p class="compact">Your habit of questioning established procedures has been noted.</p>' +
    '<div class="report"><p class="micro">DIPLOMATIC ASSESSMENT</p>' +
    '<p><strong>SUITABLE FOR IMPOSSIBLE NEGOTIATIONS.</strong><br>' +
    '<strong>UNSUITABLE FOR UNQUESTIONING COMPLIANCE.</strong></p></div>' +
    '<blockquote class="quote closing-quote">“Nevertheless, a difficulty is not the same as a preclusion.”' +
    '<span>— Ava, <em>Custom Renders Us Insensible</em></span></blockquote>' +
    '<aside class="dc-note" aria-label="Personal message from DC">' +
      '<p class="dc-note__heading">FROM THE DESK OF DC</p>' +
      '<p class="dc-note__role">Chief Bureaucrat, Bureau of Implausible Affairs</p>' +
      '<p>Dear Ava,</p>' +
      '<p>I wanted to make you something to celebrate what you\'ve done.</p>' +
      '<p>Somehow, it became an international stationery dispute.</p>' +
      '<p>I was going to staple this to your thesis, but I\'ve started questioning my habitual attachments.</p>' +
      '<p><strong>Congratulations, Ava. The originality of your thinking, the rigour of your argument, and the humanity of where it leads. It\'s stunning.</strong></p>' +
      '<p class="dc-note__signoff">DC</p>' +
    '</aside>' +
    '<div class="new-case"><p class="micro">NEW CASE OPENED</p>' +
      '<strong>THE PAPERCLIP INCIDENT II:<br>NEGOTIATIONS TO DETERMINE WHETHER THE FIRST INCIDENT WAS, IN FACT, AN INCIDENT.</strong>' +
      '<p class="micro">STATUS: PENDING. AGAIN.</p>' +
    '</div>' +
    '<div class="button-row">' + v4Button('Reopen this ridiculous case', 'replay') + '</div>' +
    '<p class="procedural-aside">*SUBJECT TO FURTHER NEGOTIATION.</p>' +
    '</section>';
}



    const pages = { intro, desk, interview, statement, ruling, review, update: updated, ending };

    function render(focusHeading) {
      screen.innerHTML = pages[state.page]();
      footerStatus.textContent = state.page === "intro" ? "Case file unopened" :
        state.page === "ending" ? "Case closed · Probably" :
        "Evidence filed: " + interviewed() + " of 3";
      if (focusHeading) {
        const heading = screen.querySelector("h1, h2");
        if (heading) heading.focus({ preventScroll: true });
        const rect = screen.getBoundingClientRect();
        if (rect.top < 0 || rect.top > window.innerHeight * .65) {
          screen.scrollIntoView({ behavior: "instant", block: "start" });
        }
      }
    }

    screen.addEventListener("click", function(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const value = button.dataset.action;
      if (value === "start" || value === "desk") state.page = "desk";
      else if (value === "replay") state = freshState();
      else if (value === "ruling" && interviewed() === 3 && state.page === "desk") state.page = "ruling";
      else if (value === "review" && state.page === "ruling") state.page = "review";
      else if (value === "update" && state.page === "review") state.page = "update";
      else if (value === "ending" && state.page === "update") state.page = "ending";
      else if (value === "file" && state.page === "statement") {
        state.visited[state.witness] = true;
        state.page = "desk";
      }
      else if (value.startsWith("witness:")) {
        const id = value.slice(8);
        if (!WITNESSES.some(w => w.id === id)) return;
        state.witness = id;
        state.page = "interview";
      } else if (value.startsWith("answer:") && state.page === "interview") {
        const index = Number(value.slice(7));
        if (index !== 0 && index !== 1) return;
        state.answer = index;
        state.page = "statement";
      } else return;
      render(true);
    });

    render(false);
  </script>
</body>
</html>
