<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation Paperclip II — Agent Ava</title><style>body{background:#17363a;color:#17363a;font:19px/1.5 Georgia;margin:0;padding:32px 14px}main{max-width:680px;margin:auto;background:#fbf5e6;padding:clamp(22px,6vw,54px);min-height:75vh;box-shadow:9px 12px #a88c5e;transform:rotate(-.2deg)}h1{font-size:clamp(45px,9vw,76px);line-height:1;letter-spacing:-.06em}h2{font-size:clamp(30px,6vw,47px);line-height:1.1}small,.meta{font:12px/1.5 monospace;color:#a74740;letter-spacing:.08em}button{display:block;width:100%;text-align:left;background:#fffaf0;color:#17363a;border:1px solid #a99b7e;padding:16px;margin:10px 0;font:16px Georgia;cursor:pointer}button:hover,button:focus-visible{background:#e4e9dc;outline:2px solid #a74740}.primary{background:#17363a;color:#fffaf0;font:700 14px monospace}.machine{background:#e9dfc9;border:1px solid #b8a98b;padding:17px;margin:22px 0;font:15px/1.6 monospace}.stamp{display:inline-block;color:#aa443c;border:4px double #aa443c;padding:9px;transform:rotate(-7deg);font:bold 19px monospace}blockquote{border-left:3px solid #a74740;padding-left:18px;font-style:italic}footer{border-top:1px solid #b8a98b;margin-top:35px;padding-top:12px;font:11px monospace;color:#68726c}</style><main><small>BUREAU OF IMPLAUSIBLE AFFAIRS / LEVEL 7½ CLEARANCE</small><div id="screen" aria-live="polite"></div><footer>FILE BIA/014/2026 · ALL EVIDENCE MAY BE CIRCUMSTANTIAL</footer></main><script>
"use strict";
const people=[
{name:"Paperclip",role:"Alleged infiltrator",question:"Why were you in stapler territory?",reply:"Two pages wanted to stay together without making it permanent. I was respecting their boundaries.",interpretation:"SUBJECT OPPOSES COMMITMENT.",foot:"Paperclips have always been suspicious. SOURCE: Previous classifications. SOURCE OF PREVIOUS CLASSIFICATIONS: See above."},
{name:"Stapler",role:"Complainant",question:"Why is this a security matter?",reply:"My family has fastened things in the top-left corner for generations. It's how we know we care.",interpretation:"TRADITION CONFIRMS OBJECTIVE STANDARD.",foot:"Finding supported by unanimous testimony from the Association of Staplers. The sample was described as diverse."},
{name:"Rubber Band",role:"Elastic witness",question:"What did you see?",reply:"I can understand why the stapler wants things fixed. From where I'm stretched, the paperclip makes sense too. Also, Tuesday has gone missing.",interpretation:"WITNESS REFUSES TO PICK A SIDE.",foot:"The software has not previously encountered this perspective and has requested legal representation."}
];
let visited=new Set(),page="intro",who=0,choice="";
const el=document.getElementById("screen");
function button(label,action,primary=false){return '<button class="'+(primary?'primary':'')+'" data-action="'+action+'">'+label+'</button>'}
function render(){let s='';
if(page==="intro")s='<p class="meta">PERSONAL BRIEFING / AGENT AVA</p><h1>Operation<br>Paperclip.</h1><p>An international stationery incident. A delicate diplomatic situation. An entirely disproportionate response.</p><div class="machine">A paperclip has crossed into stapler territory. The stapler suspects espionage. The rubber band is being unhelpfully elastic about the truth.</div>'+button("OPEN THE CASE FILE →","desk",true)+'<small>THINKING OPTIONAL · SUSPICION MANDATORY</small>';
if(page==="desk")s='<p class="meta">EVIDENCE REVIEW / '+visited.size+' OF 3 INTERVIEWED</p><h2>Three accounts.<br>Very little clarity.</h2><p>The bureau assures you its interpretation software is impartial. This claim has been independently verified by the software.</p>'+people.map((p,i)=>button((visited.has(i)?"✓ ":"")+"INTERVIEW "+p.name.toUpperCase()+" — "+p.role,"person:"+i)).join("")+(visited.size>=2?button("ISSUE A RULING →","ruling",true):"<small>INTERVIEW AT LEAST TWO WITNESSES.</small>");
if(page==="person"){let p=people[who];s='<p class="meta">WITNESS DEPOSITION</p><h2>'+p.name+'</h2><p>'+p.role+'</p><p><strong>AGENT AVA:</strong> '+p.question+'</p><blockquote>'+p.reply+'</blockquote><div class="machine"><small>AUTOMATIC INTERPRETATION SYSTEM</small><p><strong>'+p.interpretation+'</strong></p><small>FOOTNOTE: '+p.foot+'</small></div><p class="meta">INTERPRETATION ACCURACY: '+(visited.size===1?"98.7%":visited.size===2?"104.2%":"CLASSIFIED")+'</p>'+button("RETURN TO EVIDENCE →","desk",true)}
if(page==="ruling")s='<p class="meta">OFFICE OF DISPROPORTIONATE RESPONSES</p><h2>Issue your ruling.</h2><p>The testimony is inconsistent. Everyone appears to be operating from a different set of assumptions. This has never stopped a government department before.</p>'+ (visited.size===3?button("★ INVESTIGATE THE INVESTIGATION","review",true):'<small>ONE FURTHER INTERVIEW MAY REVEAL SOMETHING.</small>')+button("Negotiate a peace treaty","end:peace")+button("Blame the printer","end:printer")+button("Promote the rubber band","end:band")+button("← RE-EXAMINE EVIDENCE","desk");
if(page==="review")s='<p class="meta">INTERNAL REVIEW / ACCESS DISPUTED</p><h2>Investigate the investigation.</h2><p>Three witnesses disagree. Yet every statement has been classified as evidence against the paperclip.</p><div class="machine"><strong>REQUEST DENIED.</strong><p>The investigation has already been investigated.</p><small>REVIEWING AUTHORITY: Investigations Department.<br>REVIEW METHOD: Original investigation procedures.<br>FOUNDING PRINCIPLE: This is how we have always done it.<br>SOURCE: Previous editions of this document.</small></div><p>The rules used to correct mistaken judgments were themselves formed by habit. The bureau considers this proof of consistency.</p>'+button("CHALLENGE THE PROCEDURE →","challenge",true);
if(page==="challenge")s='<p class="meta">EMERGENCY PROCEDURAL REVISION</p><h2>The bureau has learned something.</h2><div class="machine"><strong>SYSTEM UPDATE COMPLETE.</strong><p>New evidence will henceforth be considered before conclusions are reached.</p><small>WARNING: This may significantly delay operations.</small></div><p>The paperclip is innocent. The stapler is intelligible under the circumstances. The rubber band is also intelligible, though harder to file.</p><p>The bureau cannot become perfectly impartial. But it can change how it judges. Its software has requested annual leave.</p>'+button("FILE THE REVISED FINDING →","end:review",true);
if(page==="ending"){let outcomes={peace:["PEACE ACHIEVED. SOMEWHAT REVERSIBLY.","The stapler leaves one corner unfastened. The paperclip stops calling staples tiny authoritarian bridges. The rubber band refuses to sign: no hands.","BEIGE"],printer:["RESPONSIBILITY SUCCESSFULLY PHOTOCOPIED.","The printer produces 47 identical denials, jams on page 48, and is appointed Chair of the Independent Review. Tuesday is cancelled.","LOW TONER"],band:["INSTITUTIONAL REFORM UNDER TENSION.","The rubber band becomes Director of Elastic Intelligence, reinstates Tuesday provisionally and abolishes fixed seating. The stapler appeals in the top-left corner.","STRETCHED"],review:["ALL PARTIES FOUND REASONABLE. UNDER THE CIRCUMSTANCES.","The circumstances remain deeply concerning. The bureau has revised its procedures and will now attempt to remember why. The Hole Punch is appointed interim director of procedural doubt.","THOUGHTFUL"]};let o=outcomes[choice];s='<p class="meta">CLOSING MEMORANDUM / AGENT AVA</p><h2>The bureau thanks you.</h2><span class="stamp">MISSION COMPLETE*</span><p><strong>'+o[0]+'</strong></p><p>'+o[1]+'</p><div class="machine">NEW THREAT LEVEL: '+o[2]+'<br>HOLE PUNCH: UNAVAILABLE FOR COMMENT</div><blockquote>“Nevertheless, a difficulty is not the same as a preclusion.”<small> — AGENT AVA, 2026</small></blockquote><p>Congratulations on your extraordinary work. The bureau has chosen to recognise it with a very small, very silly international incident.</p><div class="machine"><small>NEW CASE OPENED</small><p><strong>OPERATION PAPERCLIP II:<br>INVESTIGATION INTO WHY WE THOUGHT THE FIRST INVESTIGATION WAS FINISHED.</strong></p><small>STATUS: PENDING. AGAIN.</small></div>'+button("REOPEN THIS RIDICULOUS CASE →","restart",true)+'<small>*SUBJECT TO FURTHER INVESTIGATION.</small>'}
el.innerHTML=s}
el.addEventListener("click",e=>{let b=e.target.closest("button[data-action]");if(!b)return;let a=b.dataset.action;if(a==="restart"){visited.clear();page="intro"}else if(a.startsWith("person:")){who=Number(a.slice(7));visited.add(who);page="person"}else if(a.startsWith("end:")){choice=a.slice(4);page="ending"}else page=a;render();document.querySelector("main").scrollIntoView({block:"start",behavior:"instant"})});render();
</script></html>
