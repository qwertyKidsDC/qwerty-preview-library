<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Qwerty Labs — Updated top artwork, footer51 & dim preview</title>
<style>
  html,body { margin:0;width:100%;height:100%;background:#050a13;overflow:hidden; }
  #page { width:100%;height:100%;border:0;display:block;visibility:hidden; }
  #status {position:fixed;left:16px;bottom:16px;z-index:99;color:#f1f8f8;background:#020020;
    border:1px solid #555;padding:10px 13px;font:14px Arial,sans-serif;}
  #status.error {background:#9c1524;border-color:white;}
</style>
</head>
<body>
<iframe id="page" title="Qwerty Labs workshop — updated top artwork and footer51" src="../ql-workshop-two-images/?v=bottom-corrected"></iframe>
<div id="status" role="status">Preparing updated top artwork preview…</div>
<script>
// Independent preview using the new top artwork in its existing orientation.
// The approved footer and existing site controls are preserved.
const frame = document.getElementById('page');
const status = document.getElementById('status');
let processing = false;
let complete = false;
function fail(error) {
  status.className = 'error';
  status.textContent = 'Preview error: ' + error.message;
}
function applyApprovedTop() {
  if (processing || complete) return;
  try {
    const sourceDoc = frame.contentDocument;
    const sourceFrame = sourceDoc && sourceDoc.getElementById('page');
    const doc = sourceFrame && sourceFrame.contentDocument;
    const win = sourceFrame && sourceFrame.contentWindow;
    const site = doc && doc.querySelector('.site');
    const photo = doc && doc.querySelector('.bg-scene__photo');
    const footer = doc && doc.querySelector('.bg-scene-bottom__photo');
    if (!sourceFrame || !doc || !win || !site || !photo || !footer
        || sourceFrame.style.visibility !== 'visible') return;

    const originalFooter = win.getComputedStyle(footer).backgroundImage;
    if (!originalFooter || originalFooter === 'none') throw Error('Original bottom image is missing.');
    const approvedTopURL = new URL('qwerty-top-approved.webp', location.href).href;
    processing = true;

    const style = doc.createElement('style');
    style.id = 'ql-approved-top-only';
    style.textContent = `
      /* Correctly oriented TOP image; preserve geometry and fade. */
      html body .site[data-scene] .bg-scene__photo,
      html body .site[data-scene] .bg-scene__photo::after {
        background-image: url("${approvedTopURL}") !important;
      }
    `;
    doc.head.appendChild(style);

    // Preserve the accepted geometry and top fade unchanged.
    // The footer has the correct distinct image, but its darkening layers stack
    // on top of the image and effectively hide it. Fade the PHOTO, not a dark veil.
    const bottomStyle = doc.createElement('style');
    bottomStyle.id = 'ql-matched-bottom-fade';
    bottomStyle.textContent = `
      .site[data-scene] .bg-scene-bottom__photo {
        -webkit-mask-image:linear-gradient(to bottom,
          transparent 0%,rgba(0,0,0,.12) 9%,rgba(0,0,0,.5) 23%,
          rgba(0,0,0,.88) 36%,#000 45%,#000 100%)!important;
        mask-image:linear-gradient(to bottom,
          transparent 0%,rgba(0,0,0,.12) 9%,rgba(0,0,0,.5) 23%,
          rgba(0,0,0,.88) 36%,#000 45%,#000 100%)!important;
      }
      /* Remove the double darkening which made the footer nearly black.
         The actual footer image retains its original colours and position. */
      .site[data-scene] .bg-scene-bottom__tones,
      .site[data-scene] .bg-scene-bottom__vignette {
        opacity:0!important;
        background:transparent!important;
      }
    `;
    doc.head.appendChild(bottomStyle);

    // Only replace the footer artwork; keep all existing geometry and fades.
    const approvedFooterURL = new URL('../ql-workshop-two-images-fade-match/qwerty-footer-cropped-51px-top.png', location.href).href;
    const footerImageStyle = doc.createElement('style');
    footerImageStyle.id = 'ql-approved-footer-image';
    footerImageStyle.textContent = `
      .site[data-scene] .bg-scene-bottom__photo {
        background-image: url("${approvedFooterURL}") !important;
      }
    `;

    doc.head.appendChild(footerImageStyle);

    // Match Top Dim: use a dark overlay instead of filtering the photo.
    const dimStyle = doc.createElement('style');
    dimStyle.id = 'ql-bottom-dim-matched-to-top';
    dimStyle.textContent = `
      .site[data-scene] .bg-scene-bottom__photo {
        filter:none !important;
      }
      .site[data-scene] .bg-scene-bottom__tones {
        opacity:1 !important;
        background:rgba(4,9,18,var(--scene-bottom)) !important;
        -webkit-mask-image:linear-gradient(to bottom,
          transparent 0%,rgba(0,0,0,.12) 9%,rgba(0,0,0,.5) 23%,
          rgba(0,0,0,.88) 36%,#000 45%,#000 100%) !important;
        mask-image:linear-gradient(to bottom,
          transparent 0%,rgba(0,0,0,.12) 9%,rgba(0,0,0,.5) 23%,
          rgba(0,0,0,.88) 36%,#000 45%,#000 100%) !important;
      }
    `;
    doc.head.appendChild(dimStyle);

    // Previously 32% meant neutral brightness. Now 0% is neutral:
    // preserve the approved footer brightness on load and after Reset.
    const bottomSlider = doc.getElementById('bottom-dim');
    if (!bottomSlider) throw Error('Bottom Dim control was not found.');
    function resetBottomDim() {
      bottomSlider.value = '0';
      bottomSlider.dispatchEvent(new win.Event('input', { bubbles:true }));
    }
    resetBottomDim();
    const resetButton = doc.getElementById('reset-look');
    if (resetButton) resetButton.addEventListener('click', resetBottomDim);
    const appliedBottomMask = win.getComputedStyle(footer).maskImage
      || win.getComputedStyle(footer).webkitMaskImage;
    if (!appliedBottomMask.includes('45%')) throw Error('Corrected bottom fade was not applied.');

    const topNow = win.getComputedStyle(photo).backgroundImage;
    const overlay = win.getComputedStyle(photo, '::after');
    const footerNow = win.getComputedStyle(footer).backgroundImage;
    if (!topNow.includes(approvedTopURL)) throw Error('Approved top was not applied.');
    if (overlay.content !== 'none' && overlay.display !== 'none'
        && !overlay.backgroundImage.includes(approvedTopURL)) {
      throw Error('Top fade is using the wrong image.');
    }
    if (!footerNow.includes(approvedFooterURL)) throw Error('Approved footer image not applied.');
    frame.style.visibility = 'visible';
    status.textContent = 'New top artwork • Footer51 preserved • Bottom Dim reconnected';
    complete = true;
    setTimeout(() => status.remove(), 3500);
  } catch(e) { fail(e); }
  finally { processing = false; }
}
frame.addEventListener('load', () => {
  const sourceDoc = frame.contentDocument;
  const sourceFrame = sourceDoc && sourceDoc.getElementById('page');
  if (!sourceFrame) { fail(Error('Two-image source page did not load.')); return; }
  sourceFrame.addEventListener('load', applyApprovedTop);
  const sourceStatus = sourceDoc.getElementById('status');
  if (sourceStatus) {
    new MutationObserver(applyApprovedTop).observe(sourceStatus, {
      attributes:true, childList:true, subtree:true, characterData:true
    });
  }
  applyApprovedTop();
});
setTimeout(() => {
  if (!complete && !status.classList.contains('error'))
    fail(Error('The source image did not finish loading.'));
}, 25000);
</script>
</body>
</html>
