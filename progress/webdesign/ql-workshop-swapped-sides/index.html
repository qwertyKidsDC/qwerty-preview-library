const image = 'data:image/webp;base64,' + encoded;
const iframe = document.getElementById('page');
const status = document.getElementById('status');
function failed(e){status.className='error';status.textContent='Preview error: '+e.message;}
iframe.addEventListener('load',()=>{
  try{
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;
    if(!doc || !win) throw Error('Cannot access the workshop preview.');
    const photo = doc.querySelector('.bg-scene__photo');
    const site = doc.querySelector('.site');
    if(!photo || !site) throw Error('The current workshop background layer has changed.');
    const style=doc.createElement('style');
    style.id='swapped-workshop-preview-only';
    style.textContent = `
      html {--scene-top-photo:url("${image}") !important;
            --scene-bottom-photo:url("${image}") !important;
            --scene-photo:url("${image}") !important;}
      html body .site[data-scene] {
        --scene-top-photo:url("${image}") !important;
        --scene-bottom-photo:url("${image}") !important;
        --scene-photo:url("${image}") !important;
      }
      html body .site[data-scene] .bg-scene__photo,
      html body .site[data-scene] .bg-scene__photo::after,
      html body .site[data-scene] .bg-scene-bottom__photo {
        background-image:url("${image}") !important;
      }
    `;
    doc.head.appendChild(style);
    const needle=image.slice(0,68);
    const targets=[
      [photo, undefined, 'main image'],
      [photo, '::after','upper fade image'],
      [doc.querySelector('.bg-scene-bottom__photo'),undefined,'lower image']
    ];
    for(const [element,pseudo,label] of targets) {
       if(element && !win.getComputedStyle(element,pseudo).backgroundImage.includes(needle))
          throw Error(label+' did not update.');
    }
    iframe.style.visibility='visible';
    status.textContent='Swapped sides • independent preview';
    setTimeout(()=>status.remove(),4500);
  }catch(e){failed(e)}
});
</script>
