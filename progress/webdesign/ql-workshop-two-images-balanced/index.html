const iframe = document.getElementById('page');
const status = document.getElementById('status');
function failed(e){
  status.className = 'error';
  status.textContent = 'Preview error: ' + e.message;
}
iframe.addEventListener('load', () => {
  try {
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;
    if (!doc || !win) throw Error('Cannot access the workshop reference page.');
    const site = doc.querySelector('.site');
    const photo = doc.querySelector('.bg-scene__photo');
    const footer = doc.querySelector('.bg-scene-bottom__photo');
    if (!site || !photo || !footer) throw Error('Missing original scenery layers.');
    const originalFooter = win.getComputedStyle(footer).backgroundImage;
    if (!originalFooter || originalFooter === 'none') {
      throw Error('The reference page bottom artwork is missing.');
    }

    const style = doc.createElement('style');
    style.id = 'ql-swapped-top-only';
    style.textContent = `
      /* Only the bottom photo's visibility is reduced to balance the stronger foot-of-page artwork. */
      html body .site[data-scene] .bg-scene-bottom__photo { opacity:.80!important; }
      /* All source-page CSS, masks, geometry and imagery otherwise remain untouched. */
      html body .site[data-scene] .bg-scene__photo,
      html body .site[data-scene] .bg-scene__photo::after {
        background-image: url("${topImage}") !important;
      }
    `;
    doc.head.appendChild(style);

    const token = topImage.slice(0,80);
    if (!win.getComputedStyle(photo).backgroundImage.includes(token)) {
      throw Error('Swapped top image not applied.');
    }
    const topOverlay = win.getComputedStyle(photo, '::after');
    if (topOverlay.content !== 'none' && topOverlay.display !== 'none'
        && !topOverlay.backgroundImage.includes(token)) {
      throw Error('Top fade still uses previous image.');
    }
    const currentFooter = win.getComputedStyle(footer).backgroundImage;
    if (currentFooter !== originalFooter) {
      throw Error('Reference bottom image was changed unexpectedly.');
    }
    if (currentFooter.includes(token)) {
      throw Error('The footer is repeating the swapped top image.');
    }
    if (Math.abs(Number(win.getComputedStyle(footer).opacity) - .80) > .001) {
      throw Error('Bottom-only intensity adjustment not applied.');
    }
    iframe.style.visibility = 'visible';
    status.textContent = 'Balanced comparison • bottom image 80% opacity';
    setTimeout(() => status.remove(), 3500);
  } catch(e) { failed(e); }
});
</script>
</body>
</html>
