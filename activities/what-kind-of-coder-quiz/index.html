<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Kind of Coder Could You Be? | Qwerty Labs</title>
<style>:root{--blue:#4C69E3;--pink:#F66DC1;--green:#92D644;--orange:#FF9029;--paper:#F1F8F8;--ink:#020020}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 70px}header{background:var(--ink);color:var(--paper);padding:32px 20px}header>div{max-width:720px;margin:auto}h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.03;letter-spacing:-.05em;margin:12px 0}h2{font-size:1.6rem;line-height:1.2}button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:14px;padding:14px;text-align:left;background:white;color:var(--ink);min-height:54px}button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}.options{display:grid;gap:10px}.options button[aria-pressed=true]{background:var(--green);font-weight:700;box-shadow:4px 4px 0 var(--ink)}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.controls button{background:var(--orange);font-weight:700}.controls button:disabled{opacity:.4;cursor:not-allowed}.meta{font-weight:700;color:#333}.panel{background:white;border:2px solid var(--ink);border-radius:20px;padding:24px;box-shadow:5px 5px 0 var(--ink)}.tag{display:inline-block;background:var(--pink);border-radius:7px;padding:3px 8px;font-size:.8rem;font-weight:800}.hidden{display:none}a{color:#203da9}li{margin-bottom:12px}@media(min-width:650px){header{padding:45px 24px}main{padding-top:34px}}</style></head><body>
<header><div><strong>QWERTY LABS / THE LAB</strong><h1>What kind of coder could you be?</h1><p>There are no wrong answers. You don't need to know what you want to make yet. Let's find something worth trying.</p></div></header>
<main><section id="quiz" class="panel"><div class="meta" id="progress" aria-live="polite"></div><h2 id="question"></h2><div id="options" class="options" role="group" aria-label="Choose an answer"></div><div class="controls"><button id="back" type="button">← Back</button><button id="skip" type="button">Skip this one</button><button id="next" type="button">Next →</button></div></section><section id="result" class="panel hidden" aria-live="polite"></section><p style="margin-top:30px"><small>Made for curious minds at Qwerty Labs. Your answers stay on this device; nothing is submitted.</small></p></main>
<script>
const categories={world:{name:"World Builder",description:"You might enjoy designing rules, levels and unexpected worlds.",ideas:["MakeCode Arcade: build a world with a strange rule","Flowlab: make one room that changes as you explore"]},robot:{name:"Robot Inventor",description:"You might like code that makes real things move, react and behave.",ideas:["Codey Rocky: invent a robot personality","Build a reaction-time machine with lights and buttons"]},art:{name:"Digital Artist",description:"You might enjoy creating surprising visuals and interactive art.",ideas:["p5.js: make a drawing that changes when you move the mouse","Code a colourful pattern generator"]},mystery:{name:"Mystery Maker",description:"You might like stories, puzzles, secrets and clever choices.",ideas:["Twine: create a two-minute mystery with three endings","Make a mini digital escape room"]},gadget:{name:"Gadget Hacker",description:"You might like inventing useful or delightfully unnecessary machines.",ideas:["Make a secret alarm with sensors","Program a silly electronic lock"]},app:{name:"App Inventor",description:"You might enjoy making interactive tools for other people.",ideas:["Make a ridiculous prediction website","Build a tiny app that solves a very specific problem"]}};
const questions=[
["You get a mystery box of technology. What sounds most fun?",["Make a tiny world inside it","Make it move around","Make it draw something surprising","Hide a secret message","Turn it into an alarm","Make it do something useful"]],
["Which result would make you grin?",["A game level changes","A robot does something unexpected","A screen explodes with colour","Someone solves my puzzle","A gadget actually works","Someone uses my app"]],
["You can change ONE thing about a project.",["Its rules","Its behaviour","Its appearance","Its story","Its electronics","Its controls"]],
["Pick a superpower.",["Invent new worlds","Bring objects to life","Draw with mathematics","Create impossible mysteries","Build anything from spare parts","Make technology easier for people"]],
["Which challenge sounds least boring?",["Make gravity weird","Teach a robot to be shy","Make music become shapes","Build a secret passage","Create a motion alarm","Design a one-button tool"]],
["What would you rather show a friend?",["A level they can play","A robot they can meet","A picture that moves","A puzzle they can't solve","A machine you invented","A tool they can try"]],
["If something goes wrong, what might you investigate?",["The game rules","The robot's reactions","The animation","The clues","The circuit","The buttons"]],
["Pick the weirdest idea you'd actually try.",["A world with disappearing floors","A robot afraid of corners","Art that grows when you clap","A mystery told by a vending machine","A biscuit-protection device","An app that rates excuses"]]
];
const keys=Object.keys(categories);let index=0;const answers=Array(questions.length).fill(null);
const byId=id=>document.getElementById(id);
function render(){byId("progress").textContent="QUESTION "+(index+1)+" OF "+questions.length;byId("question").textContent=questions[index][0];const box=byId("options");box.replaceChildren();questions[index][1].forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",String(answers[index]===i));b.addEventListener("click",()=>{answers[index]=i;render()});box.append(b)});byId("back").disabled=index===0;byId("next").textContent=index===questions.length-1?"See my ideas →":"Next →"}
function advance(){if(index<questions.length-1){index++;render()}else showResult()}
function showResult(){const scores=keys.map((k,i)=>({key:k,score:answers.filter(a=>a===i).length})).sort((a,b)=>b.score-a.score);const picks=scores[0].score===0?[scores[0],scores[1]]:scores.slice(0,2);const r=byId("result");r.replaceChildren();const tag=document.createElement("div");tag.className="tag";tag.textContent="YOUR EXPERIMENT MENU";r.append(tag);const h=document.createElement("h2");h.textContent="You don't have to pick a forever project.";r.append(h);const p=document.createElement("p");p.textContent="Try one of these and see what happens. These are suggestions, not personality labels.";r.append(p);picks.forEach((p,i)=>{const c=categories[p.key],h=document.createElement("h2"),d=document.createElement("p"),ul=document.createElement("ul");h.textContent=(i===0?"Try first: ":"Also try: ")+c.name;d.textContent=c.description;c.ideas.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.append(li)});r.append(h,d,ul)});const wild=categories[keys.find(k=>!picks.some(p=>p.key===k))];const w=document.createElement("p");w.textContent="Wildcard: "+wild.ideas[0];r.append(w);const restart=document.createElement("button");restart.textContent="↻ Try again";restart.addEventListener("click",()=>{answers.fill(null);index=0;r.classList.add("hidden");byId("quiz").classList.remove("hidden");render()});r.append(restart);byId("quiz").classList.add("hidden");r.classList.remove("hidden");window.scrollTo(0,0)}
byId("back").addEventListener("click",()=>{if(index>0){index--;render()}});byId("skip").addEventListener("click",advance);byId("next").addEventListener("click",advance);render();
</script></body></html>
