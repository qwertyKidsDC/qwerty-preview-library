name: Qwerty Labs - current website quality gate

on:
  push:
    paths:
      - "website/qwertylabs/**"
      - "website/_maintenance/qwertylabs/**"
      - ".github/workflows/ql-current-site-quality.yml"
  pull_request:
    paths:
      - "website/qwertylabs/**"
      - "website/_maintenance/qwertylabs/**"
      - ".github/workflows/ql-current-site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source and browser validators
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 tinycss2 playwright pillow
          npm install --no-save --no-package-lock axe-core vnu-jar@26.10.12
          python -m playwright install chromium --with-deps
      - name: Validate completed pages against the HTML5 specification
        run: |
          npx vnu --errors-only \
            website/qwertylabs/index.html \
            website/qwertylabs/kids.html \
            website/qwertylabs/tools.html \
            website/qwertylabs/a-kids-pov.html \
            website/qwertylabs/kids-coding-classes.html \
            website/qwertylabs/forms/classes.html \
            website/qwertylabs/forms/camps.html \
            website/qwertylabs/forms/teen-camps.html \
            website/qwertylabs/coding-camp.html \
            website/qwertylabs/child-safety.html \
            website/qwertylabs/privacy.html \
            website/qwertylabs/booking-terms.html
      - name: Audit assets, CSS, JavaScript, desktop, mobile and WCAG
        if: always()
        run: |
          python website/_maintenance/qwertylabs/check_site.py --out site-quality-report
      - name: Smoke test enrolment forms
        if: always()
        run: |
          python website/_maintenance/qwertylabs/test_forms.py --out site-quality-report
      - name: Preserve QA report and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwertylabs-site-quality
          path: site-quality-report/
          retention-days: 14
