name: Correct rectangular paper margins (one-time)
on:
  push:
    paths:
      - ".github/workflows/ql-fix-rectangular-paper-once.yml"
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Fill remaining white margins of the two rectangular frames
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np, pathlib, subprocess
          
          root=pathlib.Path('website/qwertylabs/img')
          targets={
            'RaspberryPi5-frame-fixed.webp':'0605f222e2bcadfcf0ac7ecc3ccce254696f4a2e',
            'mascot-ready/MS02-R01-C06-framed.webp':'7f2bb10b1790d01233840b13dba16efcd1ca827c'
          }
          for name,sha in targets.items():
              path=root/name
              assert path.is_file(),f'Missing asset: {path}'
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==sha,f'Source changed: {path}'
              original=Image.open(path).convert('RGBA')
              width,height=original.size
              assert width==971 and height==715, f'Unexpected dimensions: {name}: {original.size}'
              a=np.asarray(original,dtype=np.uint8)
              result=a.copy()
              # The five-pixel border and outer cardboard are deliberately excluded.
              # Only the photographic white margin inside the rectangular paper insert is adjusted.
              y,x=np.ogrid[:height,:width]
              region=((x>=37)&(x<927)&(y>=46)&(y<668))
              margins=((x<103)|(x>=866)|(y<79)|(y>=636))
              rgb=a[:,:,:3].astype(np.int16)
              low=rgb.min(axis=2)
              high=rgb.max(axis=2)
              # White mat pixels, not cream cardboard, coloured mascot artwork or existing textured paper.
              whiteness=np.clip((low-231)/19.0,0,1)
              neutral=np.clip((20-(high-low))/15.0,0,1)
              strength=whiteness*neutral*region*margins*(a[:,:,3]>230)
              # Natural paper texture sampled directly from the actual framed image,
              # from a mascot-free corner of the existing textured paper, not generated artwork.
              # The sample is confined to the upper-right interior at the edge of the paper.
              patch=a[83:136,740:830,:3].copy()
              patch_low=patch.min(axis=2)
              patch_hi=patch.max(axis=2)
              # Avoid any accidentally sampled saturated subject pixels.
              safe=(patch_low>165)&((patch_hi-patch_low)<36)
              assert safe.mean()>.80,f'Insufficient clean paper sample in {name}'
              med=np.median(patch[safe],axis=0)
              patch[~safe]=med
              # Repeated fine-scale paper grain, sampling same image's texture on each asset.
              ph,pw=patch.shape[:2]
              iy=np.arange(height)[:,None]%ph
              ix=np.arange(width)[None,:]%pw
              texture=patch[iy,ix].astype(np.float32)
              # Preserve subtle inner-edge shadows rather than flattening the frame.
              # Match the local paper cream colour, not a new white interior.
              k=strength[:,:,None].astype(np.float32)
              result[:,:,:3]=np.clip(a[:,:,:3].astype(np.float32)*(1-k)+texture*k,0,255).astype(np.uint8)
              assert np.array_equal(result[:,:,3],a[:,:,3])
              changed=np.any(result[:,:,:3]!=a[:,:,:3],axis=2)
              assert changed.any() and np.all(changed<= (region&margins))
              assert changed.sum()>8000,f'Expected white frame area not updated: {name}: {changed.sum()}'
              Image.fromarray(result,'RGBA').save(path,'WEBP',quality=95,method=6,alpha_quality=100)
              assert Image.open(path).size==(width,height)
              print(name,'changed',int(changed.sum()),'pixels; square images untouched')
          print('Finished both rectangular frame assets; no page or stylesheet changes.')
          PY
      - name: Commit only two rectangles and remove one-time runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/qwertylabs/img/RaspberryPi5-frame-fixed.webp website/qwertylabs/img/mascot-ready/MS02-R01-C06-framed.webp
          git rm .github/workflows/ql-fix-rectangular-paper-once.yml
          git diff --cached --name-only
          git commit -m "Fill paper across both rectangular Qwerty mascot frames"
          git push origin HEAD:main
