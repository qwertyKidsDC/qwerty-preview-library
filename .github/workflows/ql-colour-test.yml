name: Correct isolated Qwerty colour-test artwork
on:
  push:
    paths:
      - ".github/workflows/ql-colour-test.yml"
      - "progress/webdesign/ql-site-v2-colour-test/_tools/recolour.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - run: python progress/webdesign/ql-site-v2-colour-test/_tools/recolour.py
      - name: Commit revised test assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress/webdesign/ql-site-v2-colour-test/
          if ! git diff --cached --quiet; then
            git commit -m "Recolour test artwork to the Qwerty brand palette"
            git push
          fi
