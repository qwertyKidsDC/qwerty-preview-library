name: Blend Qwerty rectangular paper seams once
on:
  push:
    paths:
      - ".github/workflows/ql-blend-rectangle-seams-once.yml"
permissions:
  contents: write
jobs:
  blend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Feather only the paper seams in the two rectangle images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          import cv2
          import subprocess
          
          root = Path("website/qwertylabs/img")
          sources = {
              "RaspberryPi5-frame-fixed.webp": "2aec59590d08bfd32d7196cce91e610b2d6b92e2",
              "mascot-ready/MS02-R01-C06-framed.webp": "7bc0349d8594aabbc7e792c14eba2f4706fbd5c5",
          }
          
          for name, expected_sha in sources.items():
              file = root/name
              assert file.is_file(), f"Missing source: {name}"
              sha = subprocess.check_output(["git","hash-object",str(file)],text=True).strip()
              assert sha == expected_sha, f"Source changed since inspection: {name}: {sha}"
          
              image = Image.open(file).convert("RGBA")
              src = np.asarray(image).copy()
              h,w = src.shape[:2]
              assert (w,h)==(971,715), (name,w,h)
              rgb = src[:,:,:3].astype(np.float32)
          
              # The source has two paper surfaces meeting around this inner rectangle.
              # Blend only that seam. The approved cardboard outside is not part of the edit.
              yy,xx = np.indices((h,w),dtype=np.float32)
              seam_positions = (
                  (np.abs(xx-97), (yy>=53)&(yy<=663)),
                  (np.abs(xx-874), (yy>=53)&(yy<=663)),
                  (np.abs(yy-63), (xx>=84)&(xx<=888)),
                  (np.abs(yy-650), (xx>=84)&(xx<=888)),
              )
              spread = 21.0
              mix = np.zeros((h,w),dtype=np.float32)
              seam_bounds = np.zeros((h,w),dtype=bool)
              for dist,within in seam_positions:
                  weight = 0.98 * (0.5+0.5*np.cos(np.pi*np.minimum(dist/spread,1)))
                  weight[(dist>=spread)|(~within)] = 0.0
                  mix = np.maximum(mix,weight)
                  seam_bounds |= ((dist<spread)&within)
          
              r,g,b=rgb[:,:,0],rgb[:,:,1],rgb[:,:,2]
              high = rgb.max(axis=2)
              low = rgb.min(axis=2)
              # Restrict smoothing to the cream/ivory paper itself.
              # Bright whites and tan paper both pass; saturated mascots, black ink,
              # cardboard edges and the green computer board are protected.
              paper = ((low>139)&((high-low)<62)&(r>=g-6)&(g>=b-9)&(src[:,:,3]>225))
              paper &= (xx>51)&(xx<919)&(yy>43)&(yy<673)
              mix *= paper.astype(np.float32)
          
              # Gaussian feathering removes hard boundary lines without repainting the
              # existing textures or changing colours elsewhere.
              blurred = cv2.GaussianBlur(rgb,(0,0),sigmaX=13.0,sigmaY=13.0)
              adjusted = np.clip(rgb*(1-mix[:,:,None]) + blurred*mix[:,:,None],0,255).astype(np.uint8)
              result = src.copy()
              result[:,:,:3] = adjusted
              changed = np.any(result!=src,axis=2)
              assert np.array_equal(result[:,:,3],src[:,:,3]),"Alpha changed"
              assert not np.any(changed&(~seam_bounds)), "Changed outside seam"
              assert 1500 < int(changed.sum()) < 125000, f"Unexpected affected area: {name}: {int(changed.sum())}"
          
              # Lossless WebP preserves every original pixel outside the blended bands.
              Image.fromarray(result,"RGBA").save(file,format="WEBP",lossless=True,method=6)
              final = np.asarray(Image.open(file).convert("RGBA"))
              assert np.array_equal(final[:,:,3],result[:,:,3]), "Output transparency changed"
              visible = result[:,:,3]>249
              assert np.array_equal(final[visible,:3],result[visible,:3]), "Opaque pixels changed in lossless export"
              print(name, "invisible colour-channel differences:", int(np.count_nonzero(np.any(final[:,:,:3]!=result[:,:,:3],axis=2)&(~visible))))
              assert Image.open(file).size==(w,h)
              print(f"VERIFIED {name} | smoothed {int(changed.sum())} paper pixels | outside seam pixel-identical | {file.stat().st_size} bytes")
          print("Exactly two rectangle assets changed; no square images, HTML or CSS.")
          PY
      - name: Commit only the two corrected assets and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/qwertylabs/img/RaspberryPi5-frame-fixed.webp website/qwertylabs/img/mascot-ready/MS02-R01-C06-framed.webp
          git rm .github/workflows/ql-blend-rectangle-seams-once.yml
          git diff --cached --name-only
          git commit -m "Blend paper transitions on the two rectangular Qwerty frames"
          git push origin HEAD:main
