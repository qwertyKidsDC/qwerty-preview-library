name: One-off Qwerty paper-panel pixel retouch
on:
  push:
    paths:
      - '.github/workflows/qwerty-panel-retouch-once.yml'
permissions:
  contents: write
jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing dependency
        run: python -m pip install --quiet pillow numpy
      - name: Retouch original paper pixels
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import re
          from pathlib import Path
          
          import numpy as np
          from PIL import Image
          
          ROOT = Path("progress/webdesign/ql-site-v2")
          IMG = ROOT / "img"
          SPECS = [
              ("kids-green-panel",     280, 870, 360, 792, 101, 235, 310, 205),
              ("adults-pink-panel",    365, 935, 450, 850,  91, 215, 300, 194),
              ("teens-blue-panel",     335, 885, 413, 810,  91, 200, 286, 194),
              ("ideas-panel",          366, 1015, 440, 941, 99, 205, 292, 192),
              ("components-panel",     335, 885, 413, 810,  91, 200, 286, 194),
              ("projects-panel",       401, 1065, 481, 976, 103, 210, 301, 190),
          ]
          
          for name, x0, x1, solid0, solid1, edge, fade_start, fade_end, shift in SPECS:
              original_svg = (IMG / (name + ".svg")).read_text()
              match = re.search(r'width="(\d+)" height="(\d+)" viewBox="[^"]+"', original_svg)
              data = re.search(r'href="data:image/webp;base64,([^"]+)"', original_svg)
              assert match is not None and data is not None, name
              width, height = map(int, match.groups())
              img = Image.open(io.BytesIO(base64.b64decode(data.group(1)))).convert("RGBA")
              assert img.size == (width, height), name
          
              pixels = np.array(img).astype(np.float32)
              ys = np.arange(height, dtype=np.float32)[:, None]
              xs = np.arange(width, dtype=np.float32)[None, :]
              # Entire background / corners remain unchanged. The repair is confined to the
              # central region where the tape and its shadow were baked into the original.
              wx = np.minimum(
                  np.clip((xs - x0) / (solid0 - x0), 0.0, 1.0),
                  np.clip((x1 - xs) / (x1 - solid1), 0.0, 1.0),
              )
              wy = np.clip((fade_end - ys) / (fade_end - fade_start), 0.0, 1.0)
              weight = wx * wy
              # Sample contiguous original, untaped paper from lower in the SAME asset.
              # No scaled strips, hard rectangular patches or hand-drawn CSS overlays.
              source_y = np.minimum(np.arange(height) + shift, height - 1)
              source = pixels[source_y, :, :].copy()
              # Slight tone alignment where the replacement merges into the original paper.
              sample_slice = slice(solid0, solid1)
              orig_band = pixels[fade_end-22:fade_end-2, sample_slice, :3]
              samp_band = source[fade_end-22:fade_end-2, sample_slice, :3]
              adjustment = np.clip(
                  np.median(orig_band, axis=(0, 1)) - np.median(samp_band, axis=(0, 1)),
                  -12, 12
              )
              source[:, :, :3] = np.clip(source[:, :, :3] + adjustment, 0, 255)
              # The top edge is inferred only across the removed tape area from the
              # visible untouched top edges on either side; modest deterministic wear.
              edge_wave = (1.7 * np.sin(xs * 0.094) + 1.1 * np.sin(xs * 0.041 + 1.2))
              actual_edge = edge + edge_wave
              rebuilt_alpha = np.clip((ys - actual_edge + 1.0) * 255.0, 0, 255)
              source[:, :, 3] = np.where(ys < fade_start, rebuilt_alpha, source[:, :, 3])
              result = np.clip(
                  pixels * (1.0 - weight[:, :, None]) + source * weight[:, :, None],
                  0, 255
              ).astype(np.uint8)
              assert result.shape == (height, width, 4)
              # Guardrail: edge/corner and lower portions of each original remain byte-identical.
              assert np.array_equal(result[fade_end + 2:, :, :], np.array(img)[fade_end + 2:, :, :])
              assert np.array_equal(result[:, :x0-1, :], np.array(img)[:, :x0-1, :])
          
              output = io.BytesIO()
              Image.fromarray(result, "RGBA").save(
                  output, format="WEBP", quality=95, method=5, exact=True
              )
              encoded = base64.b64encode(output.getvalue()).decode("ascii")
              svg = (
                  f'<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" '
                  f'width="{width}" height="{height}" viewBox="0 0 {width} {height}">'
                  f'<image preserveAspectRatio="none" width="{width}" height="{height}" '
                  f'href="data:image/webp;base64,{encoded}"/></svg>'
              )
              (IMG / (name + "-untaped.svg")).write_text(svg)
              print(f"PIXEL_RETOUCHED {name} {width}x{height} {len(output.getvalue())} bytes")
          if name == "kids-green-panel":
              encoded_img = np.array(Image.open(io.BytesIO(output.getvalue())).convert("RGBA"))
              for yy in [0, 15, 50, 75, 90, 99, 101, 105, 120, 150, 200, 280, 300]:
                  print("PIXEL_PROBE", yy, "x500", encoded_img[yy, 500].tolist(), "x450", encoded_img[yy, 450].tolist(), "x345", encoded_img[yy, 345].tolist())
          
          html_path = ROOT / "index.html"
          html = html_path.read_text()
          old = "?v=local-repair-8"
          new = "?v=pixel-retouch-9"
          assert html.count(old) == 6, f"Expected 6 panel URLs, found {html.count(old)}"
          html_path.write_text(html.replace(old, new))
          print("Updated only the six homepage panel references")
          PY
      - name: Diagnostic only — do not publish
        run: echo 'Pixel probe complete; no image files committed.'
