name: Fix rectangle frames paper border only
on:
  push:
    paths:
      - ".github/workflows/ql-rectangular-paper-correction-once.yml"
permissions:
  contents: write
jobs:
  fix-rectangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Correct two rectangular image backgrounds only
        run: |
          python - <<'PY'
          import pathlib,subprocess
          from PIL import Image
          import numpy as np,cv2
          root=pathlib.Path("website/qwertylabs/img")
          expected={"RaspberryPi5-frame-fixed.webp":"0605f222e2bcadfcf0ac7ecc3ccce254696f4a2e","mascot-ready/MS02-R01-C06-framed.webp":"7f2bb10b1790d01233840b13dba16efcd1ca827c"}
          paper=None  # Use the existing paper texture from each framed image
          for name,sha in expected.items():
              f=root/name
              assert f.is_file(), f"Missing source {f}"
              assert subprocess.check_output(["git","hash-object",str(f)],text=True).strip()==sha, f"Source changed: {f}"
              rgba=np.array(Image.open(f).convert("RGBA"),dtype=np.uint8)
              h,w=rgba.shape[:2]
              rgb=rgba[:,:,:3]
              hi=rgb.max(axis=2).astype(np.int16)
              lo=rgb.min(axis=2).astype(np.int16)
              y,x=np.ogrid[:h,:w]
              roi=(x>=int(w*.032))&(x<int(w*.956))&(y>=int(h*.055))&(y<int(h*.932))
              white=((lo>=235)&((hi-lo)<=19)&(rgba[:,:,3]>=240)&roi).astype(np.uint8)
              n,labels,stats,centroids=cv2.connectedComponentsWithStats(white,8)
              components=sorted([(int(stats[j,cv2.CC_STAT_AREA]),j) for j in range(1,n)],reverse=True)
              assert components, f"No white border found {name}"
              area,k=components[0]
              bx,by,bw,bh=[int(stats[k,i]) for i in (cv2.CC_STAT_LEFT,cv2.CC_STAT_TOP,cv2.CC_STAT_WIDTH,cv2.CC_STAT_HEIGHT)]
              assert area>0.04*w*h and bw>0.75*w and bh>0.70*h, f"Unsafe white mask {name}: {area} {(bx,by,bw,bh)}"
              ring=(labels==k).astype("uint8")
              # All other pixels, including mascot artwork and outer cardboard, stay unmasked.
              # One-pixel soft edge prevents a white halo on the original paper boundary.
              soft=cv2.GaussianBlur(cv2.dilate(ring,np.ones((3,3),np.uint8),iterations=1).astype("float32"),(3,3),0.65)
              alpha=np.maximum(soft,ring).clip(0,1)[:,:,None]
              sample=np.median(rgb[80:145,120:230,:],axis=(0,1))
          # Clean, existing paper-only patch: the top-left interior contains no mascots.
          patch=Image.fromarray(rgb[75:155,105:285].copy(),"RGB")
          target=np.array(patch.resize((w,h),Image.Resampling.BICUBIC),dtype=np.float32)
              target=np.clip(target+sample-np.median(target,axis=(0,1)),0,255)
              result=rgba.copy()
              result[:,:,:3]=np.clip(rgb.astype("float32")*(1-alpha)+target*alpha,0,255).astype(np.uint8)
              assert np.array_equal(result[:,:,3],rgba[:,:,3])
              Image.fromarray(result,"RGBA").save(f,format="WEBP",quality=95,method=6,alpha_quality=100)
              assert Image.open(f).size==(w,h)
              print("CORRECTED",name,"white-border pixels:",area,"border bbox:",(bx,by,bw,bh))
          print("Only two rectangular framed images changed. Square frames and HTML/CSS untouched.")
          
          PY
      - name: Commit only two corrected WebPs; remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/qwertylabs/img/RaspberryPi5-frame-fixed.webp website/qwertylabs/img/mascot-ready/MS02-R01-C06-framed.webp
          git rm ".github/workflows/ql-rectangular-paper-correction-once.yml"
          git diff --cached --name-only
          git commit -m "Fill remaining white borders in Kids and Tools rectangular frames"
          git push origin HEAD:main
