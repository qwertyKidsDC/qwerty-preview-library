name: Bake Qwerty hero-paper colours once — preserve source artwork
on:
  push:
    paths:
      - ".github/workflows/ql-bake-hero-paper-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy playwright
      - name: Bake approved paper shape, texture and tape; no SVG colour filters
        run: |
          from pathlib import Path
          from io import BytesIO
          import base64, hashlib, subprocess
          import numpy as np
          from PIL import Image, ImageFilter
          from playwright.sync_api import sync_playwright
          
          root = Path("website/qwertylabs/img")
          expected = {
              "hero-paper.svg": "0ea201b9ce2b07f42761f26a01042ab652aee0ac",
              "hero-paper-green.svg": "afc72c9037739831ee49505ccce5e03a2bed34a1",
              "hero-paper-pink.svg": "11585cee11164621376ed140da20b10aed58cde8",
              "hero-paper-orange.svg": "70edc71d9deb1b3ba208cc77150426a53c1935c3",
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(["git", "hash-object", str(root/name)], text=True).strip()
              assert actual == sha, f"Refusing to overwrite changed source: {name} {actual}"
          
          def render(browser, path):
              page = browser.new_page(viewport={"width": 1448, "height": 581}, device_scale_factor=1)
              try:
                  page.goto(path.resolve().as_uri(), wait_until="load", timeout=30000)
                  pixels = page.screenshot(omit_background=True)
                  return np.array(Image.open(BytesIO(pixels)).convert("RGBA"), dtype=np.uint8)
              finally:
                  page.close()
          
          with sync_playwright() as play:
              browser = play.chromium.launch(channel="chrome", headless=True, args=["--no-sandbox"])
              original_blue = render(browser, root/"hero-paper.svg")
              browser.close()
          
          assert original_blue.shape == (581, 1448, 4)
          src = original_blue[:,:,:3].astype(np.float32)
          r,g,b = src[:,:,0],src[:,:,1],src[:,:,2]
          # Blue paper, rather than the warm beige masking tape: keep warm artwork intact.
          dominance = b - np.maximum(r,g)
          full_mask = (dominance > 27) & (original_blue[:,:,3] > 85)
          assert int(full_mask.sum()) > 100000, f"Unsafe paper selection: {full_mask.sum()} pixels"
          median_luma = np.median(0.299*r[full_mask] + 0.587*g[full_mask] + 0.114*b[full_mask])
          assert median_luma > 35
          print("BLUE PAPER PIXELS", int(full_mask.sum()), "SOURCE LUMA", float(median_luma))
          weight = np.clip((dominance-5)/24,0,1)
          weight *= np.clip((original_blue[:,:,3].astype(np.float32)-10)/120,0,1)
          weight = np.array(Image.fromarray(np.uint8(np.round(weight*255))).filter(ImageFilter.GaussianBlur(0.55)),dtype=np.float32)/255
          strength = weight[:,:,None]
          luma = (0.299*r + 0.587*g + 0.114*b)
          shading = np.maximum(luma,0) / median_luma
          shading = np.clip(shading,0.10,1.50)**0.90
          palettes = {"blue": (76,105,227), "green": (146,214,68), "pink": (246,109,193), "orange": (255,144,41)}
          changes = {}
          for tone, rgb in palettes.items():
              out = original_blue.copy()
              if tone != "blue":
                  target = np.array(rgb,dtype=np.float32)[None,None,:] * shading[:,:,None]
                  out[:,:,:3] = np.uint8(np.clip(src*(1-strength)+target*strength,0,255).round())
                  paper_median = np.median(out[:,:,:3][full_mask],axis=0)
                  print(tone.upper(), "median paper RGB", paper_median.astype(int).tolist(), "target", list(rgb))
                  assert np.max(np.abs(paper_median-np.asarray(rgb))) <= 24, f"{tone}: palette drift too great"
              # One finished, lossless raster embedded inside the unchanged SVG dimensions.
              buffer=BytesIO()
              Image.fromarray(out,"RGBA").save(buffer,format="WEBP",lossless=True,method=6)
              mime="image/webp"
              image_data=base64.b64encode(buffer.getvalue()).decode("ascii")
              svg = ('<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" '
                     'width="1448" height="581" viewBox="0 0 1448 581">'
                     '<!-- Finished artwork, baked colour; no runtime colour filters. -->'
                     '<image preserveAspectRatio="none" width="1448" height="581" '
                     'href="data:'+mime+';base64,'+image_data+'"/></svg>\n')
              name="hero-paper.svg" if tone=="blue" else f"hero-paper-{tone}.svg"
              assert "<filter" not in svg and "filter=" not in svg and svg.startswith("<svg ")
              assert out.shape==original_blue.shape
              if tone=="blue":
                  assert np.array_equal(out,original_blue), "Blue appearance changed before baking"
              changes[name]=svg
          for name,content in changes.items():
              (root/name).write_text(content,encoding="utf-8")
              print("BAKED",name,"chars",len(content))
          print("ONLY the four hero-paper SVG assets were rewritten; HTML, CSS and blurb papers untouched.")
          
      - name: Verify changed paths, commit hero SVGs and remove one-time runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/qwertylabs/img/hero-paper.svg
          git add website/qwertylabs/img/hero-paper-green.svg
          git add website/qwertylabs/img/hero-paper-pink.svg
          git add website/qwertylabs/img/hero-paper-orange.svg
          git rm .github/workflows/ql-bake-hero-paper-once.yml
          git diff --cached --name-only
          git diff --cached --name-only | grep -v -E '^(.github/workflows/ql-bake-hero-paper-once.yml|website/qwertylabs/img/hero-paper(-green|-pink|-orange)?.svg)$' && exit 1 || true
          git commit -m "Bake palette-true hero-paper assets without SVG filters"
          git push origin HEAD:main
