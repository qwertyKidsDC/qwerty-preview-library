name: Qwerty Labs shared style contract

on:
  push:
    paths:
      - 'website/qwertylabs/**'
      - '.github/workflows/qwertylabs-style-contract.yml'
  pull_request:
    paths:
      - 'website/qwertylabs/**'
      - '.github/workflows/qwertylabs-style-contract.yml'

jobs:
  style-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit shared CSS and HTML components
        run: python3 website/qwertylabs/_tools/check_style_contract.py
