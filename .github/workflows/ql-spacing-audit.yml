name: Qwerty Labs v2 spacing audit
# Manual-only: the studio changes pages frequently; avoid installing a browser
# and generating large screenshots on every future CSS/HTML commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow cairosvg playwright
      - run: python -m playwright install chromium --with-deps
      - name: Measure alpha bounds and page layout
        run: python progress/webdesign/ql-site-v2/_tools/spacing_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ql-spacing-audit
          path: |
            progress/webdesign/ql-site-v2/_tools/audit-report.json
            progress/webdesign/ql-site-v2/_tools/audit-*.png
