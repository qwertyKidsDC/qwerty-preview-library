name: Optimise Kids tool frames
on:
  push:
    paths:
      - '.github/workflows/ql-optimise-kids-frames.yml'
      - 'website/qwertylabs/_tools/optimise_kids_frames.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Convert approved PNG frames and validate transparency
        run: python website/qwertylabs/_tools/optimise_kids_frames.py
      - name: Commit verified WebP images and page references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/qwertylabs/kids.html website/qwertylabs/img/*-frame-fixed.webp
          if ! git diff --cached --quiet; then
            git commit -m "Serve optimised transparent Kids tool frames"
            git push
          fi
