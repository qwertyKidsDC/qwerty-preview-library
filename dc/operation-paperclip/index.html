<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#142c31">
  <title>Operation Paperclip — Security Clearance</title>
  <meta http-equiv="refresh" content="5;url=https://qwertykids.com/correspondence/">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #142c31; color: #142c31;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 550px); padding: clamp(26px, 6vw, 48px);
      background: #fbf5e6; border: 10px solid #b99b67;
      box-shadow: 8px 10px 0 rgba(0,0,0,.22);
    }
    .eyebrow { font: 700 12px/1.6 "Courier New", monospace; letter-spacing: .12em; color: #ac423b; text-transform: uppercase; }
    h1 { margin: 10px 0 18px; font-size: clamp(35px, 8vw, 54px); line-height: 1.07; letter-spacing: -.035em; }
    p { font-size: 19px; line-height: 1.5; }
    .notice { padding: 16px; border-left: 4px solid #ac423b; background: #f1e6cf; }
    a { display: inline-block; margin-top: 10px; padding: 14px 18px; color: #fbf5e6; background: #142c31; font: 700 13px/1.5 "Courier New", monospace; text-decoration: none; text-transform: uppercase; }
    a:focus-visible { outline: 3px solid #ac423b; outline-offset: 4px; }
    .small { font: 12px/1.5 "Courier New", monospace; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Bureau of Implausible Affairs / Classified correspondence</p>
    <h1>Security clearance required.</h1>
    <p class="notice">Your login details were transmitted separately by text. Consult your secure communications.</p>
    <p class="small">Transferring to the classified case file shortly…</p>
    <a href="https://qwertykids.com/correspondence/">Open the case file →</a>
  </main>
</body>
</html>
